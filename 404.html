<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta
      name="description"
      content="Page Not Found - Stackly Care Services. We're here to help you find your way back to compassionate care."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <title>Page Not Found - Stackly Care Services</title>

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="assets/images/logoStackly.webp"
      type="image/webp"
    />

    <!-- Google Fonts & CDN Libraries -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/404.css" />
  </head>
  <body>
    <div class="error-page-container">
      <!-- Ambient Background Glows -->
      <div class="glow-blob glow-blob-1"></div>
      <div class="glow-blob glow-blob-2"></div>
      <div class="glow-blob glow-blob-3"></div>

      <!-- Main Elegant Card -->
      <div class="error-card">
        <!-- Logo Header -->
        <div class="error-logo-wrap">
          <a
            class="navbar-brand d-flex align-items-center justify-content-center text-decoration-none"
            href="index.html"
          >
            <img
              src="assets/images/logoStackly.webp"
              alt="Stackly Care Services Logo"
              style="height: 48px; width: auto"
              class="me-2 header-logo"
            />
          </a>
        </div>

        <!-- Animated Graphic -->
        <div class="error-graphic-wrap">
          <h1 class="error-number">404</h1>
          <div class="error-icon-box">
            <i class="fa-solid fa-compass animate-spin-slow"></i>
            <div class="error-icon-heart animate-pulse-soft">
              <i class="fa-solid fa-heart"></i>
            </div>
          </div>
        </div>

        <!-- Typography -->
        <h2 class="error-title font-secondary">
          This path has wandered off...
        </h2>
        <p class="error-description">
          Just like a comforting helper, we are here to support you and help you
          find your way. The page you are looking for might have been moved or
          doesn't exist anymore, but we'll guide you back.
        </p>

        <!-- Actions -->
        <div class="error-actions">
          <a href="index.html" class="btn btn-teal rounded-pill shadow-sm">
            <i class="fa-solid fa-house"></i> Back to Home
          </a>
          <button
            type="button"
            onclick="
              document.referrer && window.history.length > 1
                ? window.history.back()
                : (window.location.href = 'index.html')
            "
            class="btn btn-outline-teal rounded-pill"
          >
            <i class="fa-solid fa-arrow-left"></i> Go Back
          </button>
        </div>

        <!-- Quick Navigation Directory -->
        <div class="error-links-section">
          <p class="error-links-title">Popular Destinations</p>
          <div class="error-links-grid">
            <a href="pages/about.html" class="error-link-card">
              <div class="link-card-icon-box bg-teal-xlight">
                <i class="fa-solid fa-circle-info text-teal"></i>
              </div>
              <span class="link-card-text">About Us</span>
            </a>
            <a href="pages/services.html" class="error-link-card">
              <div class="link-card-icon-box bg-accent-xlight">
                <i class="fa-solid fa-hand-holding-heart text-accent"></i>
              </div>
              <span class="link-card-text">Services</span>
            </a>
            <a href="pages/team.html" class="error-link-card">
              <div class="link-card-icon-box bg-teal-xlight">
                <i class="fa-solid fa-users text-teal"></i>
              </div>
              <span class="link-card-text">Our Team</span>
            </a>
            <a href="pages/contact.html" class="error-link-card">
              <div class="link-card-icon-box bg-accent-xlight">
                <i class="fa-solid fa-envelope text-accent"></i>
              </div>
              <span class="link-card-text">Contact Us</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
